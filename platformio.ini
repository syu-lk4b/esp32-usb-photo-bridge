; ESP32 USB Photo Bridge
;
; Target board: ES3C28P / ESP32-S3 with 16 MB flash and OPI PSRAM.
; For a plain ESP32-S3-DevKitC-1:
;   - set board_upload.flash_size = 8MB
;   - set memory_type = qio_qspi
;   - adjust the PIN_SD_* values below to match your SD wiring
;
; The USB port must run in TinyUSB device mode (ARDUINO_USB_MODE=0), otherwise
; USBMSC is unavailable.

[env:esp32s3]
platform = espressif32@6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = partitions_ota.csv
board_build.arduino.memory_type = qio_opi

build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; SD card wiring (4-bit SDMMC). Override here for your board.
    -DPIN_SD_CLK=38
    -DPIN_SD_CMD=40
    -DPIN_SD_D0=39
    -DPIN_SD_D1=41
    -DPIN_SD_D2=48
    -DPIN_SD_D3=47
